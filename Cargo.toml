[package]
name = "nsh-app-zeedle-nsh"
version = "0.1.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.3.0"
nsh-base = { version = "0.3.0", default-features = false }
base64 = "0.22"
image = "0.25"
lofty = "0.24"
open = "=5.4.0"
rfd = "0.15"
rodio = "0.22.2"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
