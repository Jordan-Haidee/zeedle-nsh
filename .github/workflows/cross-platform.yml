name: Cross-platform build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: windows
          - name: Linux x64
            os: ubuntu-24.04
            target: linux
          - name: macOS Apple Silicon
            os: macos-15
            target: macos

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-4-dev \
            libxkbcommon-dev \
            libwebkitgtk-6.0-dev \
            x11-utils \
            pkg-config \
            xvfb

      - name: Install NSH 0.6.1 on Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NSH_VERSION = 'v0.6.1'
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install NSH 0.6.1 on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export NSH_VERSION=v0.6.1
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Inno Setup 6
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $innoRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6')
          )
          $innoRoot = $innoRoots | Where-Object { Test-Path (Join-Path $_ 'ISCC.exe') } | Select-Object -First 1
          if (-not $innoRoot) {
            winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation with winget failed' }
            $innoRoot = $innoRoots | Where-Object { Test-Path (Join-Path $_ 'ISCC.exe') } | Select-Object -First 1
          }
          if (-not $innoRoot) { throw 'Inno Setup 6 ISCC.exe was not found' }
          $innoRoot | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: cargo build --locked

      - name: Run Rust tests
        run: cargo test --locked

      - name: Check TSX UI
        run: nsh check -v

      - name: Test playback selection
        if: runner.os != 'Linux'
        run: nsh test ui/playback.test.ts --target ${{ matrix.target }}

      - name: Test playback selection on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a nsh test ui/playback.test.ts --target linux

      - name: Render TSX UI
        if: runner.os != 'Linux'
        run: nsh test tests/platform-render.test.tsx --target ${{ matrix.target }}

      - name: Render TSX UI on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a nsh test tests/platform-render.test.tsx --target linux

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          nsh package App.tsx --target windows
          $installer = '.nsh/out/Zeedle-setup.exe'
          if (!(Test-Path -LiteralPath $installer)) { throw "Missing NSH installer: $installer" }
          New-Item -ItemType Directory -Force -Path .nsh/out/artifacts | Out-Null
          Copy-Item -LiteralPath $installer -Destination .nsh/out/artifacts/Zeedle-windows-x86_64-setup.exe

      - name: Verify Windows window constraints
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/check-windows-window-constraints.ps1
          ./scripts/check-windows-startup.ps1

      - name: Package Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a nsh package --target linux
          xvfb-run -a bash scripts/check-linux-window-constraints.sh
          mkdir -p .nsh/out/artifacts
          cp .nsh/out/Zeedle.tar.gz .nsh/out/artifacts/Zeedle-linux-x86_64.tar.gz

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          nsh package --target macos

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: .nsh/out/artifacts/*.exe
          if-no-files-found: error
      - name: Upload Linux tarballs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: .nsh/out/artifacts/*.tar.gz
          if-no-files-found: error
      - name: Upload macOS app bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: |
            .nsh/out/Zeedle.app
          if-no-files-found: error
          compression-level: 0
