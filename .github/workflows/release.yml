name: Portable release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.ui }} / ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: windows
            arch: x86_64
            ui: tsxui
          - os: windows-latest
            platform: windows
            target: windows
            arch: x86_64
            ui: rustui
          - os: ubuntu-24.04
            platform: linux
            target: linux
            arch: x86_64
            ui: tsxui
          - os: ubuntu-24.04
            platform: linux
            target: linux
            arch: x86_64
            ui: rustui
          - os: macos-15
            platform: macos
            target: macos
            arch: aarch64
            ui: tsxui
          - os: macos-15
            platform: macos
            target: macos
            arch: aarch64
            ui: rustui

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype6-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libxkbcommon-dev pkg-config x11-utils xvfb

      - name: Install NSH on Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NSH_VERSION = 'v0.3.0'
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install NSH on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export NSH_VERSION=v0.3.0
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version="$(jq -r .version nsh.json)"
          if [[ "$GITHUB_EVENT_NAME" == push && "$version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match nsh.json version $app_version" >&2
            exit 1
          fi

      - name: Check UI sources
        run: nsh check -v

      - name: Test Rust package startup configuration
        run: python tests/test_rust_package_main.py

      - name: Render TSX UI
        if: matrix.ui == 'tsxui' && runner.os != 'Linux'
        run: nsh test tests/platform-render.test.tsx --target ${{ matrix.target }}

      - name: Render TSX UI on Linux
        if: matrix.ui == 'tsxui' && runner.os == 'Linux'
        run: xvfb-run -a nsh test tests/platform-render.test.tsx --target linux

      - name: Render Rust UI
        if: matrix.ui == 'rustui' && runner.os != 'Linux'
        run: python scripts/with-rust-root.py nsh test tests/rust-platform-render.test.tsx --target ${{ matrix.target }}

      - name: Render Rust UI on Linux
        if: matrix.ui == 'rustui' && runner.os == 'Linux'
        run: xvfb-run -a python scripts/with-rust-root.py nsh test tests/rust-platform-render.test.tsx --target linux

      - name: Test Rust context menu
        if: matrix.ui == 'rustui' && runner.os != 'Linux'
        run: python tests/test_rust_context_menu.py --target ${{ matrix.target }}

      - name: Test Rust context menu on Linux
        if: matrix.ui == 'rustui' && runner.os == 'Linux'
        run: xvfb-run -a python tests/test_rust_context_menu.py --target linux

      - name: Package Windows TSX UI
        if: matrix.ui == 'tsxui' && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          ./scripts/check-windows-window-constraints.ps1 -Ui tsxui
          ./scripts/check-windows-startup.ps1
          Move-Item .nsh/out/Zeedle.zip "Zeedle-$env:GITHUB_REF_NAME-tsxui-windows-${{ matrix.arch }}.zip"

      - name: Package Windows Rust UI
        if: matrix.ui == 'rustui' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/with-rust-root.py nsh package --target windows --out .nsh/out/rustui
          python scripts/rust_package_main.py --target windows --install
          ./scripts/check-windows-window-constraints.ps1 -Ui rustui
          Move-Item .nsh/out/rustui/Zeedle.zip "Zeedle-$env:GITHUB_REF_NAME-rustui-windows-${{ matrix.arch }}.zip"

      - name: Package Linux UI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "${{ matrix.ui }}" == rustui ]]; then
            xvfb-run -a python scripts/with-rust-root.py nsh package --target linux --out .nsh/out/rustui
            python scripts/rust_package_main.py --target linux --install
            xvfb-run -a bash scripts/check-linux-window-constraints.sh rustui
            archive=".nsh/out/rustui/Zeedle.tar.gz"
          else
            xvfb-run -a nsh package --target linux --out .nsh/out/tsxui
            python scripts/rust_package_main.py --target linux --ui tsxui --install
            xvfb-run -a bash scripts/check-linux-window-constraints.sh tsxui
            archive=".nsh/out/tsxui/Zeedle.tar.gz"
          fi
          mv "$archive" "Zeedle-${GITHUB_REF_NAME}-${{ matrix.ui }}-linux-${{ matrix.arch }}.tar.gz"

      - name: Package macOS TSX UI
        if: matrix.ui == 'tsxui' && runner.os == 'macOS'
        shell: bash
        run: |
          nsh package --target macos --out .nsh/out/tsxui
          ditto -c -k --sequesterRsrc --keepParent .nsh/out/tsxui/Zeedle.app \
            "Zeedle-${GITHUB_REF_NAME}-tsxui-macos-${{ matrix.arch }}.zip"

      - name: Package macOS Rust UI
        if: matrix.ui == 'rustui' && runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/with-rust-root.py nsh package --target macos --out .nsh/out/rustui
          python scripts/rust_package_main.py --target macos --install
          ditto -c -k --sequesterRsrc --keepParent .nsh/out/rustui/Zeedle.app \
            "Zeedle-${GITHUB_REF_NAME}-rustui-macos-${{ matrix.arch }}.zip"

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: Zeedle-${{ github.ref_name }}-${{ matrix.ui }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: Zeedle-${{ github.ref_name }}-${{ matrix.ui }}-${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Zeedle-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Verify all portable archives
        shell: bash
        run: |
          expected=(
            "Zeedle-${GITHUB_REF_NAME}-tsxui-windows-x86_64.zip"
            "Zeedle-${GITHUB_REF_NAME}-rustui-windows-x86_64.zip"
            "Zeedle-${GITHUB_REF_NAME}-tsxui-linux-x86_64.tar.gz"
            "Zeedle-${GITHUB_REF_NAME}-rustui-linux-x86_64.tar.gz"
            "Zeedle-${GITHUB_REF_NAME}-tsxui-macos-aarch64.zip"
            "Zeedle-${GITHUB_REF_NAME}-rustui-macos-aarch64.zip"
          )
          for archive in "${expected[@]}"; do
            if [[ ! -s "dist/$archive" ]]; then
              echo "Missing release archive: $archive" >&2
              find dist -maxdepth 1 -type f -print >&2
              exit 1
            fi
          done
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [[ "$count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} portable archives, found $count" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
