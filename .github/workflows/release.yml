name: Platform release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.ui }} / ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: windows
            arch: x86_64
            ui: tsxui
          - os: windows-latest
            platform: windows
            target: windows
            arch: x86_64
            ui: rustui
          - os: ubuntu-24.04
            platform: linux
            target: linux
            arch: x86_64
            ui: tsxui
          - os: ubuntu-24.04
            platform: linux
            target: linux
            arch: x86_64
            ui: rustui
          - os: macos-15
            platform: macos
            target: macos
            arch: aarch64
            ui: tsxui
          - os: macos-15
            platform: macos
            target: macos
            arch: aarch64
            ui: rustui

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype6-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libxkbcommon-dev pkg-config x11-utils xvfb

      - name: Install NSH 0.6.1 on Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NSH_VERSION = 'v0.6.1'
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install NSH 0.6.1 on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export NSH_VERSION=v0.6.1
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Inno Setup 6
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $innoRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6')
          )
          $innoRoot = $innoRoots | Where-Object { Test-Path (Join-Path $_ 'ISCC.exe') } | Select-Object -First 1
          if (-not $innoRoot) {
            winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation with winget failed' }
            $innoRoot = $innoRoots | Where-Object { Test-Path (Join-Path $_ 'ISCC.exe') } | Select-Object -First 1
          }
          if (-not $innoRoot) { throw 'Inno Setup 6 ISCC.exe was not found' }
          $innoRoot | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version="$(jq -r .version nsh.json)"
          if [[ "$GITHUB_EVENT_NAME" == push && "$version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match nsh.json version $app_version" >&2
            exit 1
          fi

      - name: Check UI sources
        run: nsh check -v

      - name: Render TSX UI
        if: matrix.ui == 'tsxui' && runner.os != 'Linux'
        run: nsh test tests/platform-render.test.tsx --target ${{ matrix.target }}

      - name: Render TSX UI on Linux
        if: matrix.ui == 'tsxui' && runner.os == 'Linux'
        run: xvfb-run -a nsh test tests/platform-render.test.tsx --target linux

      - name: Render Rust UI
        if: matrix.ui == 'rustui' && runner.os != 'Linux'
        run: python scripts/with-rust-root.py nsh test tests/rust-platform-render.test.tsx --target ${{ matrix.target }}

      - name: Render Rust UI on Linux
        if: matrix.ui == 'rustui' && runner.os == 'Linux'
        run: xvfb-run -a python scripts/with-rust-root.py nsh test tests/rust-platform-render.test.tsx --target linux

      - name: Test Rust context menu
        if: matrix.ui == 'rustui' && runner.os != 'Linux'
        run: python tests/test_rust_context_menu.py --target ${{ matrix.target }}

      - name: Test Rust context menu on Linux
        if: matrix.ui == 'rustui' && runner.os == 'Linux'
        run: xvfb-run -a python tests/test_rust_context_menu.py --target linux

      - name: Package Windows TSX UI
        if: matrix.ui == 'tsxui' && runner.os == 'Windows'
        shell: pwsh
        run: |
          nsh package App.tsx --target windows
          ./scripts/check-windows-window-constraints.ps1 -Ui tsxui
          ./scripts/check-windows-startup.ps1
          $installer = '.nsh/out/Zeedle-setup.exe'
          if (!(Test-Path -LiteralPath $installer)) { throw "Missing NSH installer: $installer" }
          Copy-Item -LiteralPath $installer -Destination "Zeedle-$env:GITHUB_REF_NAME-tsxui-windows-${{ matrix.arch }}-setup.exe"

      - name: Package Windows Rust UI
        if: matrix.ui == 'rustui' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/with-rust-root.py nsh package --target windows --out .nsh/out/rustui
          ./scripts/check-windows-window-constraints.ps1 -Ui rustui
          $installer = '.nsh/out/rustui/Zeedle-setup.exe'
          if (!(Test-Path -LiteralPath $installer)) { throw "Missing NSH installer: $installer" }
          Copy-Item -LiteralPath $installer -Destination "Zeedle-$env:GITHUB_REF_NAME-rustui-windows-${{ matrix.arch }}-setup.exe"

      - name: Package Linux UI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "${{ matrix.ui }}" == rustui ]]; then
            xvfb-run -a python scripts/with-rust-root.py nsh package --target linux --out .nsh/out/rustui
            xvfb-run -a bash scripts/check-linux-window-constraints.sh rustui
            archive=".nsh/out/rustui/Zeedle.tar.gz"
          else
            xvfb-run -a nsh package --target linux --out .nsh/out/tsxui
            xvfb-run -a bash scripts/check-linux-window-constraints.sh tsxui
            archive=".nsh/out/tsxui/Zeedle.tar.gz"
          fi
          cp "$archive" "Zeedle-${GITHUB_REF_NAME}-${{ matrix.ui }}-linux-${{ matrix.arch }}.tar.gz"

      - name: Package macOS UI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "${{ matrix.ui }}" == rustui ]]; then
            python scripts/with-rust-root.py nsh package --target macos --out .nsh/out/rustui
            app=".nsh/out/rustui/Zeedle.app"
          else
            nsh package --target macos --out .nsh/out/tsxui
            app=".nsh/out/tsxui/Zeedle.app"
          fi
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "Zeedle-${GITHUB_REF_NAME}-${{ matrix.ui }}-macos-${{ matrix.arch }}.app.zip"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Zeedle-${{ github.ref_name }}-${{ matrix.ui }}-windows-${{ matrix.arch }}
          path: Zeedle-${{ github.ref_name }}-${{ matrix.ui }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

      - name: Upload Linux tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Zeedle-${{ github.ref_name }}-${{ matrix.ui }}-linux-${{ matrix.arch }}
          path: Zeedle-${{ github.ref_name }}-${{ matrix.ui }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload macOS app bundle and release archive
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Zeedle-${{ github.ref_name }}-${{ matrix.ui }}-macos-${{ matrix.arch }}
          path: |
            .nsh/out/${{ matrix.ui }}/Zeedle.app
            Zeedle-${{ github.ref_name }}-${{ matrix.ui }}-macos-${{ matrix.arch }}.app.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Zeedle-${{ github.ref_name }}-*
          merge-multiple: false

      - name: Verify release assets
        shell: bash
        run: |
          expected=(
            "Zeedle-${GITHUB_REF_NAME}-tsxui-windows-x86_64-setup.exe"
            "Zeedle-${GITHUB_REF_NAME}-rustui-windows-x86_64-setup.exe"
            "Zeedle-${GITHUB_REF_NAME}-tsxui-linux-x86_64.tar.gz"
            "Zeedle-${GITHUB_REF_NAME}-rustui-linux-x86_64.tar.gz"
            "Zeedle-${GITHUB_REF_NAME}-tsxui-macos-aarch64.app.zip"
            "Zeedle-${GITHUB_REF_NAME}-rustui-macos-aarch64.app.zip"
          )
          assets=()
          for asset in "${expected[@]}"; do
            found="$(find dist -type f -name "$asset" -print -quit)"
            if [[ -z "$found" || ! -s "$found" ]]; then
              echo "Missing release asset: $asset" >&2
              find dist -type f -print >&2
              exit 1
            fi
            assets+=("$found")
          done
          count=$(find dist -type f \( -name '*-setup.exe' -o -name '*.tar.gz' -o -name '*.app.zip' \) | wc -l)
          if [[ "$count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release assets, found $count" >&2
            find dist -type f -print >&2
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          printf '%s\0' "${assets[@]}" > release-assets.list

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -d '' -t assets < release-assets.list
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
