name: Portable release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            target: windows
            arch: x86_64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            target: linux
            arch: x86_64
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos
            target: macos
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype6-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libxkbcommon-dev pkg-config xvfb

      - name: Install NSH on Windows x64
        if: runner.os == 'Windows' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $env:NSH_VERSION = 'v0.3.0'
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install NSH prebuilt on Linux x64 and macOS Apple Silicon
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          export NSH_VERSION=v0.3.0
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version="$(jq -r .version nsh.json)"
          if [[ "$GITHUB_EVENT_NAME" == push && "$version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match nsh.json version $app_version" >&2
            exit 1
          fi

      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Package Linux portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: nsh package --target linux

      - name: Package macOS portable archive
        if: runner.os == 'macOS'
        shell: bash
        run: nsh package --target macos

      - name: Render desktop pages and capture screenshots
        if: runner.os != 'Linux'
        run: nsh test tests/platform-render.test.tsx --target ${{ matrix.target }}

      - name: Render desktop pages and capture screenshots on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a nsh test tests/platform-render.test.tsx --target linux

      - name: Upload platform screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/platform-render-*.png
          if-no-files-found: error
          compression-level: 0

      - name: Name Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: mv .nsh/out/Zeedle.tar.gz "Zeedle-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz"

      - name: Name macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent .nsh/out/Zeedle.app "Zeedle-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.zip"

      - name: Name Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item .nsh/out/Zeedle.zip "Zeedle-$($env:GITHUB_REF_NAME)-windows-${{ matrix.arch }}.zip"

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: Zeedle-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: Zeedle-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Zeedle-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Verify all portable archives
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [[ "$count" -ne 3 ]]; then
            echo "Expected three portable archives, found $count" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
